name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 代码风格检查（ruff）
        run: |
          pip install ruff
          ruff check app tests --select F,E9

      - name: 运行单元测试
        # 测试全部离线，不需要 API Key 与数据库
        run: python -m pytest tests/ -v
